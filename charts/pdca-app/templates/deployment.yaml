apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdca-app.fullname" . }}
  labels:
    {{- include "pdca-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pdca-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pdca-app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.serverPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "pdca-app.fullname" . }}
          env:
            - name: JAVA_OPTS
              value: {{ .Values.config.javaOpts | quote }}
            {{- if .Values.database.existingSecret }}
            - name: PDCA_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- end }}
            {{- if and .Values.externalServices.openplan.url .Values.externalServices.openplan.existingSecret }}
            - name: OPENPLAN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalServices.openplan.existingSecret }}
                  key: {{ .Values.externalServices.openplan.existingSecretKey }}
            {{- end }}
            {{- if and .Values.externalServices.openproduct.url .Values.externalServices.openproduct.existingSecret }}
            - name: OPENPRODUCT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalServices.openproduct.existingSecret }}
                  key: {{ .Values.externalServices.openproduct.existingSecretKey }}
            {{- end }}
            {{- if and .Values.externalServices.gzac.enabled .Values.externalServices.gzac.existingSecret }}
            - name: GZAC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalServices.gzac.existingSecret }}
                  key: {{ .Values.externalServices.gzac.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
