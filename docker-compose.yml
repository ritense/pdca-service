# Local development stack for the PDCA app:
#
#   pdca-database    PostgreSQL for the PDCA app's own overlay data (localhost:7503)
#   openplan-*       Maykin Open Plan   (plannen register, http://localhost:7501)
#   openproduct-*    Maykin Open Product (producttypen register, http://localhost:7502)
#   openklant-*      Maykin Open Klant  (klantinteracties register, http://localhost:7504)
#   pdca-app         The app itself (http://localhost:7500) — only with --profile app
#
# Two ways to run:
#
#   docker compose up -d                           # deps only, app via ./gradlew bootRun
#   docker compose --profile app up -d --build     # entire stack in Docker
#
# The 7500-7504 block (app itself on 7500) deliberately avoids every port used
# by the Valtimo project and its dependencies: GZAC stack (8001-8012, 8080,
# 8081), plugin host samples (8090-8108), module databases (33xx, 543xx),
# opensearch (3920x) and rabbitmq (4567x, 5567x).
#
# Open Plan has no published Docker image yet, so it is built from GitHub source
# (pinned commit) on first `docker compose up`; subsequent runs use the cached
# image. Open Product and Open Klant are pulled from Docker Hub. The app never
# calls the registers itself: it reaches them through GZAC and the register
# plugins (openplan, openproduct, openklant). A plugin host running in Docker
# on this machine reaches the registers at http://host.docker.internal:7501,
# :7502 and :7504 (the URLs configured in those plugins).
#
# The *-init one-shot services run migrations, create an `admin`/`admin`
# superuser and provision fixed dev API tokens (see docker/*/init.py) that match
# the local development values of the register plugins — no manual setup needed.
#
# Admin UIs: http://localhost:7501/admin/, http://localhost:7502/admin/ and
# http://localhost:7504/admin/ (admin/admin). The registers run with the dev
# settings in docker/register-dev/pdca_dev.py: a CSRF cookie per register,
# DISABLE_2FA honoured, and every admin visitor logged in as `admin` unless
# PDCA_ADMIN_AUTOLOGIN=false.

services:
  # The app itself, opt-in via `--profile app` so the default `up -d` (used by
  # ./gradlew bootRunWithDocker) keeps starting the dependencies only.
  # PDCA_APP_IMAGE lets a cluster host run a pre-built registry image instead
  # of building from source: PDCA_APP_IMAGE=<registry>/pdca-app:<tag> \
  #   docker compose --profile app up -d --no-build
  pdca-app:
    profiles: ["app"]
    build: .
    image: ${PDCA_APP_IMAGE:-pdca-app:local}
    ports:
      - "7500:7500"
    environment:
      PDCA_DB_HOST: pdca-database
      PDCA_DB_PORT: "5432"
      # GZAC runs outside this compose project (its own stack on the host).
      GZAC_URL: http://host.docker.internal:8080
      GZAC_TOKEN_URL: http://host.docker.internal:8081/auth/realms/valtimo/protocol/openid-connect/token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      pdca-database:
        condition: service_healthy

  pdca-database:
    image: postgres:17.4-alpine
    ports:
      - "7503:5432"
    environment:
      POSTGRES_DB: pdca
      POSTGRES_USER: pdca
      POSTGRES_PASSWORD: pdca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdca -d pdca"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pdca-database-data:/var/lib/postgresql/data

  # ------------------------------ Open Plan ------------------------------

  openplan-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./docker/openplan/init-db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - openplan-db-data:/var/lib/postgresql/data

  openplan-redis:
    image: redis:7-alpine

  openplan-init:
    build:
      context: https://github.com/maykinmedia/open-plan.git#b1f945de592a5e5e0f1a6c993d30138db36eaa59
    image: pdca/openplan:local
    environment: &openplan-env
      DJANGO_SETTINGS_MODULE: openplan.conf.pdca_dev
      PDCA_ADMIN_AUTOLOGIN: ${PDCA_ADMIN_AUTOLOGIN:-true}
      SECRET_KEY: pdca-dev-only-openplan-secret
      DB_NAME: openplan
      DB_USER: openplan
      DB_HOST: openplan-db
      ALLOWED_HOSTS: "*"
      CACHE_DEFAULT: openplan-redis:6379/0
      CACHE_AXES: openplan-redis:6379/1
      DISABLE_2FA: "true"
      OTEL_SDK_DISABLED: "true"
      PGHOST: openplan-db
      PGPORT: "5432"
    volumes:
      - ./docker/register-dev/pdca_dev.py:/app/src/openplan/conf/pdca_dev.py:ro
      - ./docker/openplan/init.py:/init/init.py:ro
      - ./docker/openplan/reference_data.py:/init/reference_data.py:ro
    command:
      - sh
      - -c
      - >-
        until pg_isready; do echo 'waiting for openplan-db...'; sleep 1; done
        && python src/manage.py migrate
        && python src/manage.py createinitialsuperuser --username admin --password admin --email admin@example.com --no-input
        && python src/manage.py shell -c "exec(open('/init/init.py').read())"
    restart: "no"
    depends_on:
      - openplan-db

  openplan:
    build:
      context: https://github.com/maykinmedia/open-plan.git#b1f945de592a5e5e0f1a6c993d30138db36eaa59
    image: pdca/openplan:local
    environment: *openplan-env
    volumes:
      - ./docker/register-dev/pdca_dev.py:/app/src/openplan/conf/pdca_dev.py:ro
    ports:
      - "7501:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      openplan-db:
        condition: service_started
      openplan-redis:
        condition: service_started
      openplan-init:
        condition: service_completed_successfully

  # ---------------------------- Open Product ----------------------------

  openproduct-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./docker/openproduct/init-db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - openproduct-db-data:/var/lib/postgresql/data

  openproduct-redis:
    image: redis:7-alpine

  openproduct-init:
    image: maykinmedia/open-product:1.8.0
    environment: &openproduct-env
      DJANGO_SETTINGS_MODULE: openproduct.conf.pdca_dev
      PDCA_ADMIN_AUTOLOGIN: ${PDCA_ADMIN_AUTOLOGIN:-true}
      SECRET_KEY: pdca-dev-only-openproduct-secret
      DB_NAME: openproduct
      DB_USER: openproduct
      DB_HOST: openproduct-db
      ALLOWED_HOSTS: "*"
      CACHE_DEFAULT: openproduct-redis:6379/0
      CACHE_AXES: openproduct-redis:6379/1
      CELERY_BROKER_URL: redis://openproduct-redis:6379/2
      CELERY_RESULT_BACKEND: redis://openproduct-redis:6379/2
      DISABLE_2FA: "true"
      OTEL_SDK_DISABLED: "true"
      PGHOST: openproduct-db
      PGPORT: "5432"
      # Objecttype of the verzoek the StartInstrument acties point at (the
      # Objecttypen API of the GZAC stack; environment-specific, see README).
      PDCA_INSTRUMENT_VERZOEK_OBJECTTYPE: ${PDCA_INSTRUMENT_VERZOEK_OBJECTTYPE:-}
    volumes:
      - ./docker/register-dev/pdca_dev.py:/app/src/openproduct/conf/pdca_dev.py:ro
      - ./docker/openproduct/init.py:/init/init.py:ro
      - ./docker/openproduct/reference_data.py:/init/reference_data.py:ro
    command:
      - sh
      - -c
      - >-
        until pg_isready; do echo 'waiting for openproduct-db...'; sleep 1; done
        && python src/manage.py migrate
        && python src/manage.py createinitialsuperuser --username admin --password admin --email admin@example.com --no-input
        && python src/manage.py shell -c "exec(open('/init/init.py').read())"
    restart: "no"
    depends_on:
      - openproduct-db

  openproduct:
    image: maykinmedia/open-product:1.8.0
    environment: *openproduct-env
    volumes:
      - ./docker/register-dev/pdca_dev.py:/app/src/openproduct/conf/pdca_dev.py:ro
    ports:
      - "7502:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      openproduct-db:
        condition: service_started
      openproduct-redis:
        condition: service_started
      openproduct-init:
        condition: service_completed_successfully

  # ----------------------------- Open Klant -----------------------------
  # The image is published for linux/amd64 only (emulated on Apple silicon).

  openklant-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./docker/openklant/init-db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - openklant-db-data:/var/lib/postgresql/data

  openklant-redis:
    image: redis:7-alpine

  openklant-init:
    image: maykinmedia/open-klant:2.19.1
    platform: linux/amd64
    environment: &openklant-env
      DJANGO_SETTINGS_MODULE: openklant.conf.pdca_dev
      PDCA_ADMIN_AUTOLOGIN: ${PDCA_ADMIN_AUTOLOGIN:-true}
      SECRET_KEY: pdca-dev-only-openklant-secret
      DB_NAME: openklant
      DB_USER: openklant
      DB_HOST: openklant-db
      ALLOWED_HOSTS: "*"
      CACHE_DEFAULT: openklant-redis:6379/0
      CACHE_AXES: openklant-redis:6379/1
      CELERY_BROKER_URL: redis://openklant-redis:6379/2
      CELERY_RESULT_BACKEND: redis://openklant-redis:6379/2
      NOTIFICATIONS_DISABLED: "true"
      DISABLE_2FA: "true"
      OTEL_SDK_DISABLED: "true"
      PGHOST: openklant-db
      PGPORT: "5432"
    volumes:
      - ./docker/register-dev/pdca_dev.py:/app/src/openklant/conf/pdca_dev.py:ro
      - ./docker/openklant/init.py:/init/init.py:ro
    command:
      - sh
      - -c
      - >-
        until pg_isready; do echo 'waiting for openklant-db...'; sleep 1; done
        && python src/manage.py migrate
        && python src/manage.py shell -c "exec(open('/init/init.py').read())"
    restart: "no"
    depends_on:
      - openklant-db

  openklant:
    image: maykinmedia/open-klant:2.19.1
    platform: linux/amd64
    environment: *openklant-env
    volumes:
      - ./docker/register-dev/pdca_dev.py:/app/src/openklant/conf/pdca_dev.py:ro
    ports:
      - "7504:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      openklant-db:
        condition: service_started
      openklant-redis:
        condition: service_started
      openklant-init:
        condition: service_completed_successfully

volumes:
  pdca-database-data:
  openplan-db-data:
  openproduct-db-data:
  openklant-db-data:
