<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluatie vastleggen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'IBM Plex Sans',sans-serif;color:#161616;background:#fff;font-size:14px;line-height:1.5}
  h2{font-size:20px;font-weight:600;margin-bottom:8px}
  h3{font-size:16px;font-weight:600;margin:20px 0 12px}
  .subtitle{color:#525252;font-size:13px;margin-bottom:20px}
  .form-group{margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:500;color:#525252;margin-bottom:4px;letter-spacing:.32px}
  input[type=text],input[type=date],textarea,select{
    width:100%;padding:10px 14px;border:1px solid #8d8d8d;border-radius:0;background:#fff;
    font-family:inherit;font-size:14px;color:#161616;outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:#0f62fe;box-shadow:inset 0 0 0 1px #0f62fe}
  textarea{min-height:60px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .btn{padding:10px 24px;font-family:inherit;font-size:14px;font-weight:500;border:none;cursor:pointer}
  .btn-primary{background:#0f62fe;color:#fff}.btn-primary:hover{background:#0353e9}
  .actions{display:flex;gap:12px;margin-top:24px;justify-content:flex-end}
  .goal-progress{background:#f4f4f4;padding:14px;margin-bottom:10px;border-left:3px solid #0f62fe}
  .goal-progress .goal-name{font-weight:500;margin-bottom:8px}
  .goal-explanation input{margin-top:4px}
  .section-divider{border-top:1px solid #e0e0e0;margin:20px 0}
  .msg{padding:12px;margin-bottom:12px;background:#defbe6;border-left:3px solid #24a148;display:none}
  .loading{text-align:center;padding:40px;color:#525252}
</style>
</head>
<body>
<div class="msg" id="successMsg">Evaluatie succesvol opgeslagen!</div>
<h2>Evaluatie vastleggen</h2>
<p class="subtitle" id="planTitle">Laden...</p>

<div class="row">
  <div class="form-group">
    <label>Type evaluatie</label>
    <select id="evalType">
      <option value="INTAKE">Intake</option>
      <option value="PROGRESS" selected>Voortgangsgesprek</option>
      <option value="EVALUATION">Evaluatie</option>
      <option value="INSPECTION">Inspectie</option>
      <option value="CRISIS">Crisisconsult</option>
    </select>
  </div>
  <div class="form-group">
    <label>Datum</label>
    <input type="date" id="evalDate">
  </div>
</div>

<div class="form-group">
  <label>Deelnemers</label>
  <input type="text" id="participants" placeholder="Bijv. Sophie Jansen, Erika de Goede">
</div>

<div class="form-group">
  <label>Samenvatting</label>
  <textarea id="summary" maxlength="1000" placeholder="Beschrijf de uitkomsten van het gesprek (max. 1000 tekens)"></textarea>
</div>

<div class="section-divider"></div>
<h3>Voortgang per doel</h3>
<div id="goalProgressList"><div class="loading">Doelen laden...</div></div>

<div class="section-divider"></div>
<div class="form-group">
  <label>Actiepunten (een per regel)</label>
  <textarea id="actionPoints" placeholder="- Afspraak inplannen met arbeidscoach&#10;- CV bijwerken&#10;- Sollicitatietraining starten" style="min-height:100px"></textarea>
</div>

<div class="actions">
  <button class="btn btn-primary" onclick="submitEval()">Evaluatie opslaan</button>
</div>

<script>
// Direct integration: doelen come from Open Plan; the evaluation becomes a
// contactmoment through the overlay API, which records it as a klantcontact
// in Open Klant and keeps type/doelvoortgang/action points in the overlay.
var API=location.origin.indexOf('http')===0?location.origin:'http://localhost:7500';
var OPENPLAN=API+'/openplan/plannen/api/v0';
var planId=null;
var goals=[];
var goalDetails={};
var statusOpties=[];

var initialized=false;
window.addEventListener('message',function(e){
  if(e.data&&e.data.source==='valtimo-host'&&e.data.event==='init'&&!initialized){
    initialized=true;
    init(e.data.payload&&e.data.payload.context||{});
  }
});
window.parent.postMessage({source:'valtimo-plugin',event:'ready'},'*');
setTimeout(function(){if(!initialized){initialized=true;init({})}},500);

// Plan = dossier (1:1): the plan directly linked to this dossier (overlay).
function init(context,naResolve){
  if(!context.documentId){
    document.getElementById('planTitle').textContent='Geen dossiercontext ontvangen (plan = dossier).';
    return;
  }
  fetch(API+'/api/v1/pdca/dossiers/'+context.documentId+'/plan').then(function(r){return r.ok?r.json():null})
  .then(function(details){
    if(!details&&!naResolve){
      // Start-form route: the backend links a planId from the dossier content
      // under water; afterwards a fresh init renders and this chain stops.
      return fetch(API+'/api/v1/pdca/dossiers/'+context.documentId+'/resolve-plan',{method:'POST'})
        .then(function(r){
          if(r.ok){init(context,true)}
          else{document.getElementById('planTitle').textContent='Geen plan voor dit dossier. Maak eerst een plan aan.'}
          return Promise.reject('no plan');
        });
    }
    if(!details){document.getElementById('planTitle').textContent='Geen plan voor dit dossier. Maak eerst een plan aan.';return Promise.reject('no plan')}
    return fetch(OPENPLAN+'/plan/'+details.planUuid).then(function(r){return r.json()});
  }).then(function(plan){
    planId=plan.uuid;
    document.getElementById('planTitle').textContent=plan.titel;
    return Promise.all([
      fetch(OPENPLAN+'/doel?plannen__uuid='+planId).then(function(r){return r.json()}),
      fetch(API+'/api/v1/pdca/doeldetails?planUuid='+planId).then(function(r){return r.ok?r.json():[]}),
      fetch(OPENPLAN+'/doeltype').then(function(r){return r.json()}).catch(function(){return {results:[]}}),
      fetch(API+'/api/v1/pdca/voortgangstatussen?planUuid='+planId).then(function(r){return r.ok?r.json():[]})
    ]);
  }).then(function(res){
    // Voortgang of the running subdoelen (the voortgangsstatussen of the
    // plan's case type); the hoofddoel (the strategy) stays out, and a closed
    // doel has its register status instead.
    var hoofddoelTypeUuids={};
    (res[2].results||[]).forEach(function(dt){
      if((dt.categorieen||[]).some(function(c){return c.naam==='Hoofddoel'}))hoofddoelTypeUuids[dt.uuid]=true;
    });
    goals=(res[0].results||[]).filter(function(g){
      return g.status==='actief'&&!(g.doeltype&&hoofddoelTypeUuids[g.doeltype.uuid]);
    });
    (res[1]||[]).forEach(function(d){goalDetails[d.doelUuid]=d});
    statusOpties=res[3]||[];
    renderGoalProgress();
  }).catch(function(err){if(err==='no plan')return;document.getElementById('goalProgressList').innerHTML='<div style="color:#da1e28">Fout bij laden: '+err.message+'</div>'});
}

function renderGoalProgress(){
  var el=document.getElementById('goalProgressList');
  if(goals.length===0){el.innerHTML='<div style="color:#a8a8a8;font-style:italic">Geen doelen om te evalueren</div>';return}
  var html='';
  goals.forEach(function(g,i){
    var d=goalDetails[g.uuid]||{};
    html+='<div class="goal-progress">';
    html+='<div class="goal-name">'+esc(g.titel)+'</div>';
    html+='<select id="status_'+i+'"><option value="">Geen status</option>';
    statusOpties.forEach(function(o){
      html+='<option value="'+esc(o.code)+'"'+(o.code===d.voortgangStatus?' selected':'')+'>'+esc(o.naam)+'</option>';
    });
    html+='</select>';
    html+='<div class="goal-explanation"><input type="text" id="explanation_'+i+'" placeholder="Toelichting" value="'+(d.voortgangToelichting?esc(d.voortgangToelichting):'')+'"></div>';
    html+='</div>';
  });
  el.innerHTML=html;
}

function submitEval(){
  var goalProgress=[];
  goals.forEach(function(g,i){
    var status=document.getElementById('status_'+i).value;
    var optie=statusOpties.filter(function(o){return o.code===status})[0];
    var explanation=document.getElementById('explanation_'+i).value.trim();
    if(status||explanation){
      goalProgress.push({doelUuid:g.uuid,status:status||null,statusNaam:optie?optie.naam:null,toelichting:explanation});
    }
  });

  var ap=document.getElementById('actionPoints').value.trim();
  var actionPointsList=ap?ap.split('\n').filter(function(l){return l.trim()}).map(function(l){return l.replace(/^[-*]\s*/,'')}):[];
  var date=document.getElementById('evalDate').value||new Date().toISOString().split('T')[0];

  fetch(API+'/api/v1/pdca/contactmomenten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    planUuid:planId,
    datum:date,
    evaluatieType:document.getElementById('evalType').value,
    afgerond:true,
    verslag:document.getElementById('summary').value.trim()||null,
    deelnemers:document.getElementById('participants').value.trim()||null,
    doelVoortgang:JSON.stringify(goalProgress),
    actiepunten:JSON.stringify(actionPointsList)
  })})
  .then(function(r){
    if(!r.ok)return r.json().catch(function(){return {}}).then(function(b){throw new Error(b.message||('HTTP '+r.status))});
    return r.json();
  })
  .then(function(details){
    var cm={uuid:details.contactmomentUuid};
    goalProgress.forEach(function(gp){
      if(gp.status){
        fetch(API+'/api/v1/pdca/doeldetails/'+gp.doelUuid,{
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({planUuid:planId,voortgangStatus:gp.status,voortgangToelichting:gp.toelichting||null})
        });
      }
    });
    document.getElementById('successMsg').style.display='block';
    setTimeout(function(){
      window.parent.postMessage({source:'valtimo-plugin',event:'submitTask',payload:{data:{evaluationId:cm.uuid}}},'*');
    },1000);
  }).catch(function(err){alert('Fout bij opslaan: '+err.message)});
}

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

document.getElementById('evalDate').value=new Date().toISOString().split('T')[0];
</script>
</body>
</html>
