<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan aanmaken</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'IBM Plex Sans',sans-serif;color:#161616;background:#fff;font-size:14px;line-height:1.5}
  h2{font-size:20px;font-weight:600;margin-bottom:20px}
  .form-group{margin-bottom:16px}
  label{display:block;font-size:12px;font-weight:500;color:#525252;margin-bottom:4px;letter-spacing:.32px}
  input[type=text],input[type=date],textarea,select{
    width:100%;padding:10px 14px;border:1px solid #8d8d8d;border-radius:0;background:#fff;
    font-family:inherit;font-size:14px;color:#161616;outline:none;transition:border-color .15s;
  }
  input:focus,textarea:focus,select:focus{border-color:#0f62fe;box-shadow:inset 0 0 0 1px #0f62fe}
  textarea{min-height:80px;resize:vertical}
  .radio-group{display:flex;gap:16px;margin-top:4px}
  .radio-group label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:400;color:#161616;cursor:pointer}
  .radio-group input[type=radio]{accent-color:#0f62fe;width:16px;height:16px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .subject-preview{background:#e8f0fe;border-left:3px solid #0f62fe;padding:12px;margin-top:8px;font-size:13px;display:none}
  .subject-preview.show{display:block}
  .subject-lookup{display:flex;gap:8px;align-items:flex-end}
  .subject-lookup input{flex:1}
  .btn{padding:10px 24px;font-family:inherit;font-size:14px;font-weight:500;border:none;cursor:pointer;transition:background .15s}
  .btn-primary{background:#0f62fe;color:#fff}.btn-primary:hover{background:#0353e9}
  .btn-secondary{background:#e0e0e0;color:#161616}.btn-secondary:hover{background:#c6c6c6}
  .btn-sm{padding:6px 14px;font-size:13px}
  .actions{display:flex;gap:12px;margin-top:24px;justify-content:flex-end}
  .error{color:#da1e28;font-size:12px;margin-top:4px}
  .success-msg{background:#defbe6;border-left:3px solid #24a148;padding:16px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="success-msg" id="successMsg">Plan succesvol aangemaakt!</div>
<h2>Nieuw plan aanmaken</h2>

<!-- Plan = dossier (1:1): als dit dossier al een plan heeft, geen tweede
     plan aanmaken maar alleen de taak afronden. -->
<div id="bestaandPlan" style="display:none;background:#e8f0fe;border-left:3px solid #0f62fe;padding:16px;margin-bottom:16px">
  <p style="margin-bottom:12px">Dit dossier heeft al een plan: <strong id="bestaandPlanTitel"></strong>.</p>
  <button class="btn btn-primary" onclick="voltooiTaak()">Taak afronden</button>
</div>

<div id="planForm">
<div class="form-group">
  <label>Subjecttype</label>
  <div class="radio-group">
    <label><input type="radio" name="subjectType" value="PERSON" checked onchange="clearPreview()"> Persoon</label>
    <label><input type="radio" name="subjectType" value="OBJECT" onchange="clearPreview()"> Object</label>
  </div>
</div>

<div class="form-group">
  <label id="subjectIdLabel">BSN of Object ID</label>
  <div class="subject-lookup">
    <input type="text" id="subjectId" placeholder="Bijv. 111222333">
    <button class="btn btn-secondary btn-sm" onclick="lookupSubject()">Zoek</button>
  </div>
  <div class="subject-preview" id="subjectPreview"></div>
  <!-- Terugkeerder/los plan: bestaand ongekoppeld plan voor dit subject koppelen
       i.p.v. een nieuw plan aanmaken (plan = dossier 1:1). -->
  <div class="subject-preview" id="koppelPlanPanel" style="border-left-color:#8a3ffc">
    <p style="margin-bottom:8px">Los plan gevonden voor dit subject: <strong id="koppelPlanTitel"></strong></p>
    <button class="btn btn-primary btn-sm" id="koppelPlanBtn" onclick="koppelPlan()"></button>
  </div>
  <div class="error" id="subjectError"></div>
</div>

<div class="form-group">
  <label>Titel</label>
  <input type="text" id="title" placeholder="Bijv. Ontwikkelplan Werk - Naam">
</div>

<div class="form-group">
  <label>Dienstverlening</label>
  <select id="dienstverlening"></select>
</div>

<div class="form-group">
  <label>Hoofddoel (uit doeltype-register)</label>
  <select id="hoofddoel"></select>
  <div class="error" id="hoofddoelError"></div>
</div>

<div class="form-group">
  <label>Toelichting bij hoofddoel (t.b.v. de inwoner)</label>
  <textarea id="mainGoalToelichting" placeholder="Optioneel, in de woorden van de inwoner"></textarea>
</div>

<div class="row">
  <div class="form-group">
    <label>Beginpositie (input, doorgaans uit de intake)</label>
    <select id="beginPositie"></select>
  </div>
  <div class="form-group">
    <label>Doelpositie</label>
    <select id="doelPositie"></select>
  </div>
</div>

<div class="row">
  <div class="form-group">
    <label>Startdatum</label>
    <input type="date" id="startDate">
  </div>
  <div class="form-group">
    <label>Beoogde einddatum</label>
    <input type="date" id="targetEndDate">
  </div>
</div>

<div class="actions">
  <button class="btn btn-primary" onclick="submitPlan()">Plan aanmaken</button>
</div>
</div><!-- /planForm -->

<script>
// Direct integration: the plan is created in Open Plan (via the token proxy at
// /openplan); fase-config link, posities en hoofddoel-verwijzing go to the
// PDCA overlay. Beslissingen 17-08-26: posities uit het positietype-register
// (per domein), precies één hoofddoel uit het doeltype-register, dienstverlening
// = plantype; vrije tekst alleen als toelichting t.b.v. de inwoner.
var API=location.origin.indexOf('http')===0?location.origin:'http://localhost:7500';
var OPENPLAN=API+'/openplan/plannen/api/v0';
// Object plans get this administrative contactpersoon (doelen require a persoon).
var OBJECT_CONTACT_BSN='234567892';
var DIENSTVERLENING_LABELS={werk:'Terug naar werk',pip:'Inburgering (PIP)',inkomen:'Inkomensondersteuning'};
var context={};
var bestaandPlan=null;
var koppelbaarPlan=null;

window.addEventListener('message',function(e){
  if(e.data&&e.data.source==='valtimo-host'&&e.data.event==='init'){
    context=e.data.payload&&e.data.payload.context||{};
    if(context.documentId)checkBestaandPlan(context.documentId);
  }
});
window.parent.postMessage({source:'valtimo-plugin',event:'ready'},'*');

// Plan = dossier (1:1): bestaat er al een plan met de zaak-URN van dit
// dossier, toon dan alleen "taak afronden" i.p.v. een tweede plan aan te maken.
// Geen match? Dan kan het dossier via het startformulier een planId dragen:
// de backend koppelt dat plan onderwater, waarna we opnieuw kijken.
function checkBestaandPlan(documentId,naResolve){
  getJson(OPENPLAN+'/plan').then(function(page){
    var zaakUrn='urn:pdca:zaaksysteem:zaak:'+documentId;
    var matches=(page.results||[]).filter(function(p){return p.zaak===zaakUrn});
    if(matches.length===0){
      if(naResolve)return;
      fetch(API+'/api/v1/pdca/dossiers/'+documentId+'/resolve-plan',{method:'POST'})
        .then(function(r){if(r.ok)checkBestaandPlan(documentId,true)})
        .catch(function(){});
      return;
    }
    bestaandPlan=matches.filter(function(p){return p.status==='actief'})[0]||matches[0];
    document.getElementById('bestaandPlanTitel').textContent=bestaandPlan.titel;
    document.getElementById('planForm').style.display='none';
    document.getElementById('bestaandPlan').style.display='block';
  }).catch(function(){/* register onbereikbaar: formulier gewoon tonen */});
}

function voltooiTaak(){
  window.parent.postMessage({source:'valtimo-plugin',event:'submitTask',payload:{data:{
    planId:bestaandPlan.uuid,
    planTitle:bestaandPlan.titel,
    planStatus:bestaandPlan.status
  }},'*');
}

function getSubjectType(){
  return document.querySelector('input[name=subjectType]:checked').value;
}

function caseKey(){
  return getSubjectType()==='PERSON'?'inwonerplan':'binnenhof-renovatie';
}

function fillSelect(id,options,placeholder){
  var sel=document.getElementById(id);
  sel.innerHTML='';
  if(placeholder){
    var ph=document.createElement('option');ph.value='';ph.textContent=placeholder;sel.appendChild(ph);
  }
  options.forEach(function(o){
    var el=document.createElement('option');el.value=o.value;el.textContent=o.text;sel.appendChild(el);
  });
}

// Dienstverleningen (plantypen) en hoofddoelen (doeltype-register, categorie
// "Hoofddoel") zijn registerbreed; posities komen per domein uit de caseconfig.
function loadRegisters(){
  getJson(OPENPLAN+'/plantype').then(function(page){
    fillSelect('dienstverlening',(page.results||[]).map(function(pt){
      return {value:pt.uuid,text:DIENSTVERLENING_LABELS[pt.type]||pt.type};
    }));
  }).catch(function(){fillSelect('dienstverlening',[],'Register onbereikbaar')});
  getJson(OPENPLAN+'/doeltype').then(function(page){
    var hoofddoelen=(page.results||[]).filter(function(dt){
      return (dt.categorieen||[]).some(function(c){return c.naam==='Hoofddoel'});
    });
    fillSelect('hoofddoel',hoofddoelen.map(function(dt){
      return {value:dt.uuid,text:dt.doelType};
    }),'-- Kies hoofddoel --');
  }).catch(function(){fillSelect('hoofddoel',[],'Register onbereikbaar')});
}

function loadPosities(){
  getJson(API+'/api/v1/admin/phase-configs/'+caseKey()).then(function(cfg){
    var posities=JSON.parse(cfg.positieTypen||'[]').map(function(p){return {value:p,text:p}});
    fillSelect('beginPositie',posities,'-- Kies beginpositie --');
    fillSelect('doelPositie',posities,'-- Kies doelpositie --');
  }).catch(function(){
    fillSelect('beginPositie',[],'Geen positieregister geconfigureerd');
    fillSelect('doelPositie',[],'Geen positieregister geconfigureerd');
  });
}

function clearPreview(){
  document.getElementById('subjectPreview').classList.remove('show');
  document.getElementById('koppelPlanPanel').classList.remove('show');
  koppelbaarPlan=null;
  document.getElementById('subjectError').textContent='';
  document.getElementById('subjectIdLabel').textContent=getSubjectType()==='PERSON'?'BSN':'Object ID';
  loadPosities();
}

// Bestaat er al een actief, ongekoppeld plan (geen zaak) voor dit subject in
// dit domein, bied dan koppelen aan: als taakformulier aan dit dossier, los
// via een door PDCA aangemaakt dossier.
function zoekKoppelbaarPlan(subjectId){
  var urn=getSubjectType()==='PERSON'?'urn:pdca:brp:persoon:'+subjectId:'urn:pdca:objecten:object:'+subjectId;
  Promise.all([
    getJson(OPENPLAN+'/plan?status=actief'),
    getJson(API+'/api/v1/pdca/plandetails')
  ]).then(function(res){
    var details={};(res[1]||[]).forEach(function(d){details[d.planUuid]=d});
    var match=(res[0].results||[]).filter(function(p){
      return p.domeinregister===urn&&!p.zaak&&details[p.uuid]&&details[p.uuid].caseDefinitionKey===caseKey();
    })[0];
    if(!match)return;
    koppelbaarPlan=match;
    document.getElementById('koppelPlanTitel').textContent=match.titel;
    document.getElementById('koppelPlanBtn').textContent=(context&&context.documentId)
      ?'Koppel aan dit dossier':'Maak dossier voor dit plan';
    document.getElementById('koppelPlanPanel').classList.add('show');
  }).catch(function(){/* detectie is best effort */});
}

function koppelPlan(){
  if(!koppelbaarPlan)return;
  var msg=document.getElementById('successMsg');
  if(context&&context.documentId){
    sendJson(OPENPLAN+'/plan/'+koppelbaarPlan.uuid,'PATCH',{zaak:'urn:pdca:zaaksysteem:zaak:'+context.documentId})
    .then(function(plan){
      msg.textContent='Bestaand plan gekoppeld aan dit dossier';
      msg.style.display='block';
      window.parent.postMessage({source:'valtimo-plugin',event:'submitTask',payload:{data:{
        planId:plan.uuid,planTitle:plan.titel,planStatus:plan.status
      }},'*');
    }).catch(function(err){alert('Koppelen mislukt: '+err.message)});
  }else{
    sendJson(API+'/api/v1/pdca/plans/'+koppelbaarPlan.uuid+'/dossier','POST',null)
    .then(function(d){
      msg.textContent='GZAC-dossier '+d.documentId+' aangemaakt voor bestaand plan';
      msg.style.display='block';
      document.getElementById('koppelPlanPanel').classList.remove('show');
    }).catch(function(err){alert('Dossier aanmaken mislukt: '+err.message)});
  }
}

function lookupSubject(){
  var id=document.getElementById('subjectId').value.trim();
  if(!id){document.getElementById('subjectError').textContent='Voer een ID in';return}
  var type=getSubjectType();
  var url=type==='PERSON'?API+'/api/v1/registers/personen/'+id:API+'/api/v1/registers/objecten/'+id;
  fetch(url).then(function(r){
    if(!r.ok)throw new Error('Niet gevonden');
    return r.json();
  }).then(function(data){
    var preview=document.getElementById('subjectPreview');
    if(type==='PERSON'){
      preview.innerHTML='<strong>'+esc(data.naam)+'</strong><br>BSN: '+esc(data.bsn)+'<br>Geboortedatum: '+esc(data.geboortedatum)+'<br>Adres: '+esc(data.adres.straat+' '+data.adres.huisnummer+', '+data.adres.woonplaats);
    }else{
      preview.innerHTML='<strong>'+esc(data.naam)+'</strong><br>Type: '+esc(data.type)+'<br>Adres: '+esc(data.adres.straat+', '+data.adres.woonplaats)+'<br>Eigenaar: '+esc(data.eigenaar);
    }
    preview.classList.add('show');
    document.getElementById('subjectError').textContent='';
    zoekKoppelbaarPlan(id);
  }).catch(function(){
    document.getElementById('subjectPreview').classList.remove('show');
    document.getElementById('subjectError').textContent='Geen resultaat gevonden voor dit ID';
  });
}

function getJson(url){return fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function sendJson(url,method,body){
  return fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t)});return r.json()});
}

// Get-or-create an Open Plan persoon by bsn (no server-side bsn filter).
function ensurePersoon(bsn){
  return getJson(OPENPLAN+'/persoon').then(function(page){
    var bestaand=(page.results||[]).filter(function(p){return p.bsn===bsn})[0];
    if(bestaand)return bestaand;
    return sendJson(OPENPLAN+'/persoon','POST',{
      bsn:bsn,
      klant:'urn:pdca:openklant:klant:'+bsn,
      persoonsprofiel:'urn:pdca:profielen:persoonsprofiel:'+bsn
    });
  });
}

function submitPlan(){
  var subjectType=getSubjectType();
  var subjectId=document.getElementById('subjectId').value.trim();
  var titel=document.getElementById('title').value.trim();
  if(!subjectId||!titel){alert('Vul minimaal Subject ID en Titel in');return}
  // Precies één hoofddoel, gekozen uit het doeltype-register.
  var hoofddoelTypeUuid=document.getElementById('hoofddoel').value;
  if(!hoofddoelTypeUuid){document.getElementById('hoofddoelError').textContent='Kies een hoofddoel uit het register';return}
  document.getElementById('hoofddoelError').textContent='';
  var plantypeUuid=document.getElementById('dienstverlening').value;
  if(!plantypeUuid){alert('Kies een dienstverlening');return}
  var startDate=document.getElementById('startDate').value||new Date().toISOString().split('T')[0];
  var persoonBsn=subjectType==='PERSON'?subjectId:OBJECT_CONTACT_BSN;
  var domeinregister=subjectType==='PERSON'
    ?'urn:pdca:brp:persoon:'+subjectId
    :'urn:pdca:objecten:object:'+subjectId;

  Promise.all([
    ensurePersoon(persoonBsn),
    getJson(OPENPLAN+'/overkoepelendplan')
  ]).then(function(res){
    var persoon=res[0];
    var overkoepelend=(res[1].results||[])[0];
    if(!overkoepelend)throw new Error('Open Plan mist overkoepelend plan (draai docker compose init)');
    var body={
      titel:titel,
      notitie:document.getElementById('mainGoalToelichting').value.trim(),
      startdatum:startDate+'T00:00:00Z',
      plantypeUuid:plantypeUuid,
      overkoepelendPlanUuid:overkoepelend.uuid,
      domeinregister:domeinregister
    };
    // Plan = dossier (1:1). Als taakformulier is het dossier er al: de zaak-URN
    // van dit dossier gaat mee. Los ("los een plan aanmaakt") maakt de PDCA-app
    // na het plan zélf het dossier aan in GZAC en koppelt het plan eraan.
    if(context&&context.documentId){body.zaak='urn:pdca:zaaksysteem:zaak:'+context.documentId}
    return sendJson(OPENPLAN+'/plan','POST',body).then(function(plan){
      return sendJson(API+'/api/v1/pdca/plandetails/'+plan.uuid,'PUT',{
        persoonUuid:persoon.uuid,
        caseDefinitionKey:caseKey(),
        weergaveStatus:'Concept',
        beginPositie:document.getElementById('beginPositie').value||null,
        doelPositie:document.getElementById('doelPositie').value||null,
        hoofddoelTypeUuid:hoofddoelTypeUuid,
        streefEinddatum:document.getElementById('targetEndDate').value||null
      }).then(function(){return plan});
    });
  }).then(function(plan){
    if(context&&context.documentId){return {plan:plan,dossier:null}}
    return sendJson(API+'/api/v1/pdca/plans/'+plan.uuid+'/dossier','POST',null)
      .then(function(dossier){return {plan:plan,dossier:dossier}});
  }).then(function(res){
    var plan=res.plan;
    var msg=document.getElementById('successMsg');
    msg.textContent=res.dossier
      ?'Plan en GZAC-dossier aangemaakt (dossier '+res.dossier.documentId+')'
      :'Plan succesvol aangemaakt!';
    msg.style.display='block';
    window.parent.postMessage({source:'valtimo-plugin',event:'submitTask',payload:{data:{
      planId:plan.uuid,
      planTitle:plan.titel,
      planStatus:plan.status,
      subjectBsn:subjectType==='PERSON'?subjectId:undefined,
      objectId:subjectType==='OBJECT'?subjectId:undefined,
      subjectName:titel
    }},'*');
  }).catch(function(err){alert('Fout bij aanmaken: '+err.message)});
}

function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}

document.getElementById('startDate').value=new Date().toISOString().split('T')[0];
loadRegisters();
loadPosities();
</script>
</body>
</html>
